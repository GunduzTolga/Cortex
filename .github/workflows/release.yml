name: Verified V3 release package

on:
  pull_request:
    # Whatever the package or the suite reads: the V2 runners and hooks the installer recognises,
    # the template files and theme the tests compare, the generators under scripts/ (tests-ci-6).
    paths:
      - 'VERSION'
      - 'scripts/**'
      - 'template/**'
      - 'tema/**'
      - 'tests/v3_*.py'
      - 'tests/fixtures/v3/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested package as the latest stable release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: v3-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Every tag, to hold VERSION against the releases already out (below).
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - id: version
        name: Validate release version
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          assert re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', version)
          assert Path('docs/v3/releases/' + version + '.md').is_file()
          # The app and the engine it carries are one version: the installer is named after the
          # first, the vault's engine is told apart by the second.
          desktop = json.loads(Path('desktop/package.json').read_text(encoding='utf-8'))['version']
          assert desktop == version, 'desktop/package.json is ' + desktop + ', VERSION is ' + version
          # A build given out under a version already released, with other engine bytes, never
          # reaches a vault: the updater and the app take it for that release (install-update-1).
          number = lambda tag: tuple(map(int, tag[1:].split('.')))
          tags = [tag for tag in subprocess.run(['git', 'tag', '--list', 'v*'], capture_output=True, text=True,
                                                check=True).stdout.split() if re.fullmatch(r'v\d+\.\d+\.\d+', tag)]
          engine = ['scripts/install_v3.py', 'scripts/beyin_v3.py', 'scripts/beyin_entry.py',
                    'template/.claude/scripts', 'template/.agents/skills']
          for tag in sorted(tags, key=number, reverse=True)[:1]:
              changed = subprocess.run(['git', 'diff', '--quiet', tag, 'HEAD', '--'] + engine).returncode != 0
              assert number(tag) < number('v' + version) or (number(tag) == number('v' + version) and not changed), (
                  'VERSION ' + version + ' must be above the latest release ' + tag +
                  (' because the engine changed since' if changed else ''))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('value=' + version + '\n')
          PY
      - name: Build the candidate once
        env:
          VERSION: ${{ steps.version.outputs.value }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/build_v3_release.py --version "$VERSION" --output "dist/beyin-v3-$VERSION.zip"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Cortex's first commit: the inherited runtime, labelled 0.9.0 so 1.0.0 and later are upgrades.
          ref: 7177077c57977a5959e641e767b7de39b9f2270c
          path: baseline-source
          persist-credentials: false
      - name: Build the inherited 0.9.0 installation baseline
        run: python baseline-source/scripts/build_v3_release.py --version 0.9.0 --output baseline/beyin-v3-0.9.0.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v3-release-bundle
          path: |
            dist/*
            baseline/*
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ${{ matrix.os }}
    # Windows runs the same suite in 26-28 minutes at 1.0.26 with 1757 tests, past 40 on a slow runner
    # (20 October); elsewhere 9-14 (18 October: 15 minutes cut a slow macOS/Ubuntu run short).
    # A hang still shows within the hour.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 55 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      BEYIN_V3_NO_SPAWN: '1'
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v3-release-bundle
      - name: Offline contracts
        # A hang writes where every thread stands, a few minutes before the job's own limit would only cancel it.
        run: python scripts/run_v3_tests.py --hang-after ${{ matrix.os == 'windows-latest' && 3000 || 1500 }}
      - name: Retrieval gates
        run: python scripts/evaluate_v3.py
      - name: Exact ZIP installation, upgrade from 0.9.0, rollback and recovery
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_v3_release.py --package "dist/beyin-v3-$VERSION.zip" --baseline baseline/beyin-v3-0.9.0.zip

  # Publishing is three jobs, so the release is never "latest" before both of its assets are on
  # it: the README sends people to the latest release for the Windows installer, and the vault's
  # updater, its launcher and the agents' skill for the engine package (install-update-2).
  #  1. draft: a draft release with the verified engine package. A run that failed after this
  #     finds its draft again and fills it; a release already published is never touched.
  #  2. installer: the Windows installer built around those same verified bytes (not a second
  #     build of the engine), uploaded to the draft.
  #  3. publish: both assets checked on the draft, then the draft made the latest release, then
  #     everything downloaded again and verified as a vault's updater will.
  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v3-release-bundle
      - name: Draft the release with the verified engine package
        run: |
          set -euo pipefail
          draft=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = "false" ]; then
            echo 'Release already published; refusing to overwrite it.' >&2
            exit 1
          fi
          if [ "$draft" = "true" ]; then
            # A run cut short after the draft: the same verified bytes are put on it again.
            gh release upload "v$VERSION" "dist/beyin-v3-$VERSION.zip" "dist/beyin-v3-$VERSION.zip.sha256" --clobber
          else
            gh release create "v$VERSION" "dist/beyin-v3-$VERSION.zip" "dist/beyin-v3-$VERSION.zip.sha256" --target "$GITHUB_SHA" --title "Cortex v$VERSION" --notes-file "docs/v3/releases/$VERSION.md" --draft
          fi

  installer:
    needs: [build, draft]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v3-release-bundle
      - name: Dependencies and the app
        working-directory: desktop
        run: |
          npm ci
          npm run build
      - name: Python for a machine without one
        working-directory: desktop
        run: npm run python-paket
      - name: The verified engine package, as it is published
        shell: bash
        run: |
          set -euo pipefail
          # The app carries the package this run verified and publishes, byte for byte; a second
          # build would differ in its ZIP timestamps from what vaults download as this release.
          rm -rf desktop/cortex-paket
          mkdir -p desktop/cortex-paket
          cp "dist/beyin-v3-$VERSION.zip" desktop/cortex-paket/
          python -c "import sys, zipfile; sys.stdout.write(zipfile.ZipFile(sys.argv[1]).read('manifest.json').decode('utf-8'))" "desktop/cortex-paket/beyin-v3-$VERSION.zip" > "desktop/cortex-paket/beyin-v3-$VERSION.manifest.json"
      - name: The Windows installer
        working-directory: desktop
        # Signed when the repository keeps a code-signing certificate (desktop/README.md, "İmza");
        # unsigned otherwise, as desktop.yml builds it.
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Put the installer on the draft
        shell: bash
        run: |
          set -euo pipefail
          # One name without spaces: GitHub turns a space in an asset name into a dot.
          cp "desktop/release/Cortex Setup $VERSION.exe" "Cortex-Setup-$VERSION.exe"
          gh release upload "v$VERSION" "Cortex-Setup-$VERSION.exe" --clobber

  publish:
    needs: [build, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      PYTHONDONTWRITEBYTECODE: '1'
      BEYIN_V3_NO_SPAWN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v3-release-bundle
      - name: Make the draft the latest release once both assets are on it
        run: |
          set -euo pipefail
          assets=$(gh release view "v$VERSION" --json assets --jq '.assets[].name')
          for name in "beyin-v3-$VERSION.zip" "beyin-v3-$VERSION.zip.sha256" "Cortex-Setup-$VERSION.exe"; do
            if ! printf '%s\n' "$assets" | grep -Fxq "$name"; then
              echo "The draft has no $name; not publishing." >&2
              exit 1
            fi
          done
          gh release edit "v$VERSION" --draft=false --latest
      - name: Download published assets and verify again
        run: |
          set -euo pipefail
          gh release download "v$VERSION" --pattern 'beyin-v3-*.zip*' --dir published
          gh release download "v$VERSION" --pattern 'Cortex-Setup-*.exe' --dir published
          test -s "published/Cortex-Setup-$VERSION.exe"
          cmp "dist/beyin-v3-$VERSION.zip" "published/beyin-v3-$VERSION.zip"
          python scripts/verify_v3_release.py --package "published/beyin-v3-$VERSION.zip" --baseline baseline/beyin-v3-0.9.0.zip
          python - <<'PY'
          import os, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'template/.claude/scripts')
          import beyin_v3_releases as r
          import beyin_v3_update as u
          metadata, _ = r.fetch_metadata()
          assert metadata['version'] == os.environ['VERSION']
          with tempfile.TemporaryDirectory() as folder:
              package, version = u._download(folder)
              assert version == os.environ['VERSION']
              assert package.read_bytes() == Path('dist/beyin-v3-' + version + '.zip').read_bytes()
          print('Published latest release and external digest verified.')
          PY
