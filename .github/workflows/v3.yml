name: V3 offline platform contracts

on:
  pull_request:
    paths:
      - 'template/.claude/scripts/beyin_v3*.py'
      - 'scripts/*v3*.py'
      - 'scripts/beyin_entry.py'
      - 'template/.agents/skills/**'
      - 'tests/v3_*.py'
      - 'tests/fixtures/v3/**'
      - '.github/workflows/v3.yml'
  push:
    branches: [main, 'codex/v3-foundation']
    paths:
      - 'template/.claude/scripts/beyin_v3*.py'
      - 'scripts/*v3*.py'
      - 'scripts/beyin_entry.py'
      - 'template/.agents/skills/**'
      - 'tests/v3_*.py'
      - 'tests/fixtures/v3/**'
      - '.github/workflows/v3.yml'

permissions:
  contents: read

jobs:
  stdlib-contracts:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Windows runs the same suite in 20-25 minutes; elsewhere 6-9 at 1.0.9, 9-14 at 1.0.25 with 1711 tests
    # (18 October: 15 minutes cut a slow macOS/Ubuntu run short). A hang still shows within the hour.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      BEYIN_V3_NO_SPAWN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline source, runtime, lifecycle and skill contracts
        # A hang writes where every thread stands, a few minutes before the job's own limit would only cancel it.
        run: python scripts/run_v3_tests.py --hang-after ${{ matrix.os == 'windows-latest' && 2400 || 1500 }}
      - name: Frozen development and holdout retrieval gates
        run: python scripts/evaluate_v3.py
