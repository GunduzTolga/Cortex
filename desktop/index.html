<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The window never reaches the network: it talks to the main process over
      the preload's bridge and nothing else. So nothing is allowed but the
      app's own files, and an image only as the data URL the main process
      hands over for a picture in the vault (notes:asset). A note that names
      ![](https://host/?d=...) is not fetched: an image from the network would
      tell that host the note was opened, with no click. 'self' also covers the
      Vite dev server and its socket, which serve the page from their origin.

      style-src keeps 'unsafe-inline' for the editor (CodeMirror writes its
      styles into the page) and React's style attributes; scripts are the
      app's own files only.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self' data:;
               connect-src 'self';
               worker-src 'none';
               object-src 'none';
               frame-src 'none';
               base-uri 'none';
               form-action 'none'"
    />
    <title>Cortex</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
